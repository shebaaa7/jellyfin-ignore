overview: "Per-library ignore globs with automatic nested-root isolation"
description: >
  Community fork of Jellyfin Ignore that assigns glob patterns to individual libraries. On Windows, nested dedicated-library roots can be migrated automatically to plugin-managed NTFS junction aliases, giving Jellyfin separate path identities without moving or copying media.
category: "General"
owner: "shebaaa7 (community fork of fdett)"
artifacts:
- "Jellyfin.Plugin.Ignore.dll"
changelog: >
  Replace unreliable scan-context inference with automatic NTFS junction aliases, cache all resolver state outside ShouldIgnore, add fail-safe validation and status reporting, and preserve per-library configuration. 0.8.0.0: place alias junctions on the same drive as their media, close to the drive root, instead of nested deep under Jellyfin's plugin configuration directory. This keeps deeply nested media paths well under Windows' 260-character limit, which native image decoders can silently fail against even for a valid, readable file; existing aliases are automatically relocated to the shorter path on first reconcile after upgrading. 0.9.0.0: add Linux support. Automatic aliases now also work on Linux using plain symlinks (created with .NET's built-in Directory.CreateSymbolicLink, no elevated privileges required), placed under the plugin's own configuration directory rather than a drive root, since Linux has no MAX_PATH-style path limit and "/" is not writable by the Jellyfin service user. 0.9.1.0: the plugin's settings page now appears in the dashboard's left-hand navigation menu (Plugins section) instead of only being reachable via Dashboard > Plugins > gear icon.
